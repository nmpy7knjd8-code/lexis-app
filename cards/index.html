<script>
const ERA={greek:"Ancient Greek",latin:"Latin",early_modern:"Early Modern",german:"German",french:"French",analytic:"Analytic",eastern:"Eastern",danish:"Danish"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="review";
const fp=im=>im.focal_point?`object-position:${im.focal_point[0]*100}% ${im.focal_point[1]*100}%`:"";
function art(im,c){
  if(!im.src) return `<div class="ph"><b>${esc((c&&c.latin||"·").replace(/[^A-Za-zĀ-ž]/g,"")[0]||"·")}</b><small>${esc(im.alt||"Image coming soon")}</small></div>`;
  if(im.uncut){return im.kind==="manuscript"?`<div class="tornwrap"><img onerror="imgFail(this)" class="frame torn" src="${esc(im.src)}" alt="${esc(im.alt)}" loading="lazy"></div>`:`<img onerror="imgFail(this)" class="frame arch" src="${esc(im.src)}" alt="${esc(im.alt)}" loading="lazy">`;}
  const a=`src="${esc(im.src)}" alt="${esc(im.alt)}" style="${fp(im)}"`;
  if(im.transparent) return `<img onerror="imgFail(this)" class="cut" ${a}>`;
  if(im.kind==="manuscript") return `<div class="tornwrap"><img onerror="imgFail(this)" class="frame torn" ${a}></div>`;
  return `<img onerror="imgFail(this)" class="frame arch" ${a}>`;
}
const brk=h=>h.replace(/([·\/—–-])(?=\S)/g,"$1<wbr>");
function latinHTML(c){
  if(mode!=="learn"||!c.gloss) return brk(esc(c.latin));
  let out=esc(c.latin);
  const gs=[...c.gloss];
  return c.latin.split(/(\s+)/).map(tok=>{
    const bare=tok.replace(/[.,;:!?]/g,""); const i=gs.findIndex(g=>g.word===bare);
    if(!bare.trim()||i<0) return esc(tok);

    return `<button class="w" data-g="${esc(`${g.word}: ${g.lemma}, “${g.meaning}”${g.parse?" — "+g.parse:""}`)}">${esc(bare)}</button>${esc(tok.slice(bare.length))}`;
  }).join("");
}
window.imgFail=el=>{const d=document.createElement("div");d.className="ph";d.innerHTML="<b>·</b><small>Image coming soon</small>";(el.closest(".tornwrap")||el).replaceWith(d)};
const EC=c=>{const e=(window.PHON_ECCL||{})[c.id];return e&&e.respelling_eccl};
const AU=c=>{const a=(window.AUDIO||{})[c.id];return Array.isArray(a)?a:[]};
const LU={"CC BY-SA 4.0":"https://creativecommons.org/licenses/by-sa/4.0/","CC BY-SA 3.0":"https://creativecommons.org/licenses/by-sa/3.0/","CC BY 4.0":"https://creativecommons.org/licenses/by/4.0/","CC0":"https://creativecommons.org/publicdomain/zero/1.0/"};
const LL=l=>LU[l]?`<a href="${LU[l]}" target="_blank" rel="noopener">${esc(l)}</a>`:esc(l);
let player=null;
const LMX={"q-caesar-veni":{label:"Veni, vidi, vici & the Battle of Zela",url:"https://en.wikipedia.org/wiki/Veni,_vidi,_vici"},"q-caesar-gallia":{label:"Caesar's Gallic War",url:"https://en.wikipedia.org/wiki/Commentarii_de_Bello_Gallico"},"q-cicero-tempora":{label:"O tempora, o mores!",url:"https://en.wikipedia.org/wiki/O_tempora,_o_mores!"},"q-horace-carpe":{label:"Carpe diem",url:"https://en.wikipedia.org/wiki/Carpe_diem"},"q-augustine-tolle":{label:"Tolle lege: Augustine's conversion",url:"https://en.wikipedia.org/wiki/Tolle_lege"}};

  document.getElementById("deck").innerHTML=VIS().map((c,i)=>`
<article data-id="${esc(c.id)}" class="card ${c.era} ${c.image.kind}${KN.has(c.id)?" known":""}" ${learn?`aria-label="${esc(c.person)} card"`:`tabindex="0" role="button" aria-pressed="false" aria-label="Term card: ${esc(c.latin)}, ${esc(c.person)}. Press to reveal translation."`} id="card-${i}">
 ${c._draft?`<span class="draftb">DRAFT</span>`:""}${KN.has(c.id)?`<span class="known-tick" aria-label="known">✓</span>`:""}<div class="inner">

    ${c.attribution_note?`<p>Source note: ${esc(c.attribution_note)}</p>`:""}
    <p>${c.image.src?`Image: ${esc(c.image.credit)} · ${LL(c.image.license)}${c.image.transparent&&!c.image.uncut?" · background removed":""}${c.image.uncut?" · hotlinked original":""} · <a href="${esc(c.image.museum_url||c.image.source_url)}" target="_blank" rel="noopener">source</a>`:"Image: not yet chosen"}</p>
    ${AU(c).map(a=>`<p>Audio, ${esc(String(a.style).replace(/\s*\((unverified)\)/i," – $1"))}: ${esc(a.credit)} · ${a.license_url?`<a href="${esc(a.license_url)}" target="_blank" rel="noopener">${esc(a.license)}</a>`:esc(a.license)} · <a href="${esc(a.source)}" target="_blank" rel="noopener">source</a> · ${esc(a.changes)}${a.register_note?`<br>${esc(a.register_note)}`:""}${a.caption?`<br>${esc(a.caption)}`:""}${a.note?`<br>${esc(a.note)}`:""}</p>`).join("")}
   </details>
  </div>
 </div>
</article>`).join("");
  document.querySelectorAll(".play").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();if(player)player.pause();player=new Audio("../audio/"+b.dataset.a);player.play().catch(()=>{})}));
  setupDots();cur();
  document.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const el=b.closest(".card"),id=el.dataset.id;
    KN.add(id);saveKN();el.classList.toggle("known",KN.has(id));

  document.querySelectorAll(".card").forEach(el=>{

    const t=()=>{collapse();const f=el.classList.toggle("flipped");if(f)fitSoon();el.setAttribute("aria-pressed",f);

}
function fitWide(){document.querySelectorAll(".face").forEach(fc=>{const W=fc.clientWidth-36;
  fc.querySelectorAll(".term,.la-b,.say,.ipa-b,.tl").forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    while(el.scrollWidth>el.clientWidth+1&&n++<12){fs*=.94;el.style.fontSize=fs+"px"}})})}
function fitMeta(){document.querySelectorAll(".meta").forEach(m=>{const sp=m.querySelector(".sep");if(!sp)return;sp.classList.remove("wrapped");const a=m.firstElementChild,e=m.querySelector(".era");if(a&&e&&Math.abs(a.offsetTop-e.offsetTop)>4)sp.classList.add("wrapped")})}
function expand(card){collapse();const bk=card.querySelector(".back"),r=card.getBoundingClientRect();
  const ov=document.createElement("div");ov.id="xov";ov.className="xov "+card.className.split(" ").filter(c=>/^(greek|latin|early_modern|german|french|analytic|eastern|danish)$/.test(c)).join(" ");
  ov.innerHTML=`<div class="face back xback" style="margin:${r.top}px auto 24px;width:${r.width}px;min-height:${r.height}px">${bk.innerHTML}</div>`;
  const xb=ov.querySelector(".xback");xb.querySelectorAll(".ctx").forEach(c=>{c.classList.remove("clamp");c.style.fontSize="";c.style.maxHeight=""});xb.querySelectorAll(".ipa-b").forEach(e=>e.style.display="");
  const m=xb.querySelector(".more");m.hidden=false;m.innerHTML="Show less <span aria-hidden=true>⌃</span>";
  ov.addEventListener("click",e=>{if(e.target.closest("a,details"))return;const ok=e.target.closest(".rate .ok");if(ok){collapse();card.querySelector(".rate .ok").click();return}collapse()});
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add("on"))}
function collapse(){const o=document.getElementById("xov");if(o)o.remove()}
document.addEventListener("click",e=>{const m=e.target.closest(".card .more");if(!m)return;e.stopPropagation();e.preventDefault();expand(m.closest(".card"))},true);
document.getElementById("deck").addEventListener("scroll",collapse,{passive:true});
function fitBacks(){fitWide();fitMeta();document.querySelectorAll(".back").forEach(bk=>{const cx=bk.querySelector(".ctx");if(!cx)return;
  const kids=[...bk.children].filter(e=>e.offsetHeight>0);const k=kids.length;
  const cs=getComputedStyle(bk),inner=bk.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const used=()=>kids.reduce((t,e)=>t+e.offsetHeight,0);
  const fits=g=>used()+(k-1)*g<=inner;
  let mb=bk.querySelector(".more");if(!mb){mb=document.createElement("button");mb.className="more";mb.type="button";mb.innerHTML="Show more <span aria-hidden=true>⌄</span>";cx.after(mb)}
  mb.hidden=true;
  let f=.92;cx.style.fontSize=f+"rem";cx.classList.remove("clamp");cx.style.maxHeight="";bk.style.overflowY="";bk.querySelectorAll(".ipa-b").forEach(e=>e.style.display="");
  while(!fits(7)&&f>(innerHeight<700?.68:.76)){f-=.02;cx.style.fontSize=f+"rem"}
  const clampIt=()=>{mb.hidden=false;cx.classList.add("clamp");bk.style.setProperty("--g","7px");const lh=parseFloat(getComputedStyle(cx).lineHeight)||14;
    let n=Math.floor(cx.scrollHeight/lh);cx.style.maxHeight=n*lh+"px";

    bk.style.overflowY=bk.scrollHeight>bk.clientHeight+1?"auto":""};
  if(!fits(7)){clampIt()}
  else{while(f<1.12){f+=.02;cx.style.fontSize=f+"rem";if(!fits(32)){f-=.02;cx.style.fontSize=f+"rem";break}}}
  const kk=[...bk.children].filter(e=>e.offsetHeight>0);const u2=kk.reduce((t,e)=>t+e.offsetHeight,0);
  bk.style.setProperty("--g",Math.max(7,Math.min(32,(inner-u2)/(kk.length-1)))+"px");

  bk.style.overflowY=bk.scrollHeight>bk.clientHeight+1?"auto":""})}
function fitSoon(){requestAnimationFrame(()=>requestAnimationFrame(fitBacks))}
addEventListener("resize",fitSoon);addEventListener("pageshow",fitSoon);addEventListener("orientationchange",fitSoon);if(document.fonts)document.fonts.ready.then(()=>requestAnimationFrame(fitBacks));if(window.visualViewport)visualViewport.addEventListener("resize",fitSoon);addEventListener("pageshow",fitSoon);addEventListener("orientationchange",fitSoon);
function setMode(m){mode=m;document.getElementById("m-learn").setAttribute("aria-pressed",m==="learn");document.getElementById("m-review").setAttribute("aria-pressed",m==="review");render();}
const deck=document.getElementById("deck"),dots=document.getElementById("dots");
function setupDots(){dots.innerHTML=VIS().map((c,i)=>`<button aria-label="Card ${i+1} of ${CARDS.length}: ${esc(c.person)}" data-i="${i}"></button>`).join("");
}
dots.onclick=e=>{const b=e.target.closest("button");if(b)document.getElementById("card-"+b.dataset.i).scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})};
function cur(){const r=deck.getBoundingClientRect(),mid=r.left+r.width/2;let best=0,d=1e9;
 document.querySelectorAll(".card").forEach((c,i)=>{const b=c.getBoundingClientRect(),x=Math.abs(b.left+b.width/2-mid);if(x<d){d=x;best=i}});
 curI=best;const U=UNITS[SEC-1];document.getElementById("pilln").textContent=`${U[0]} · ${U[2]}`;document.getElementById("count").textContent=`${best+1} / ${VIS().length} · ${Math.round(prog(SEC)*100)}% known`;dots.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-current",i===best))}

let showDrafts=/[?&]draft=1/.test(location.search);
const repoPath=src=>/^(https?:|data:)/.test(src)?null:(src.startsWith("../")?src.slice(3):"cards/"+src);

const UNITS=[["I","λόγος","Greek Beginnings","greek"],["II","τέλος","Aristotle & Hellenistic","greek"],["III","esse","Latin & Scholastic","latin"],["IV","cogito","Early Modern","early_modern"],["V","a priori","Kant","german"],["VI","Geist","Hegel & Idealism","german"],["VII","Übermensch","Nietzsche & Schopenhauer","german"],["VIII","Lebenswelt","Phenomenology & Existentialism","german"],["IX","Dasein","Heidegger","german"],["X","différance","French Thought","french"],["XI","Sprachspiel","Wittgenstein & Analytic","analytic"],["XII","道","Eastern & Islamic","eastern"]];
const unitOf=c=>Math.min(UNITS.length,Math.max(1,+c.unit||1));

let SEC=+localStorage.getItem("lexis.section")||1, ORDER={};
const inSec=u=>CARDS.filter(c=>(showDrafts||!c._draft)&&unitOf(c)===u);
const prog=u=>{const a=inSec(u);return a.length?a.filter(c=>KN.has(c.id)).length/a.length:0};
const unlocked=u=>true;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const sheet=document.getElementById("sheet");

 P.querySelectorAll("button").forEach(b=>{const u=+b.dataset.u;let t;
  b.onclick=()=>{if(unlocked(u))setSec(u);else{b.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:250})}};
  const start=()=>{t=setTimeout(()=>{localStorage.setItem("lexis.open."+u,"1");setSec(u)},650)},stop=()=>clearTimeout(t);
  b.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(e=>b.addEventListener(e,stop));b.oncontextmenu=e=>e.preventDefault();});
 sheet.hidden=false}
sheet.onclick=e=>{if(e.target===sheet)sheet.hidden=true};
document.getElementById("logo").onclick=openSheet;document.getElementById("pill").onclick=openSheet;document.getElementById("psec").onclick=()=>setSec(SEC>1?SEC-1:UNITS.length);document.getElementById("nsec").onclick=()=>setSec(SEC<UNITS.length?SEC+1:1);document.getElementById("sec").onclick=openSheet;

const DECKS=["b1-cards","b2-cards","b3-cards","b4-cards"];

 const norm=c=>{c=Object.assign({},c);

   for(const c of await r.json()){if(!seen.has(c.id)){seen.add(c.id);const im=c.image;if(im&&im.src&&!/^(https?:|data:|TODO:|\.\.?\/|\/)/.test(im.src))im.src="../"+(im.src.startsWith("assets/")?"":"content/")+im.src;extra.push(c)}}}catch(e){console.warn(f,e)}}
 try{const r=await fetch("../content/phonetics.json");if(r.ok)window.PHONETICS=Object.assign({},window.PHONETICS||{},await r.json());}catch(e){}
 for(const a of ["../content/audio-map.json"]){try{const r=await fetch(a);if(r.ok){window.AUDIO=await r.json();break}}catch(e){}}
